<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBERCAFE | Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --dark: #121212; --card: #1e1e1e; --text: #ffffff; --success: #2ecc71; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding-bottom: 100px; }
        header { background: #000; padding: 40px 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        h1 { font-size: 2.2rem; margin: 0; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .policy-banner { background: #c0392b; color: white; padding: 15px; border-radius: 10px; margin-bottom: 30px; text-align: center; border: 1px solid var(--gold); font-size: 0.9rem; }
        .social-links { margin-top: 20px; }
        .social-links a { color: var(--gold); font-size: 1.5rem; margin: 0 15px; text-decoration: none; transition: 0.3s; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .p-img-container { width: 100%; height: 180px; background: #252525; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-img-container i { font-size: 4rem; color: var(--gold); opacity: 0.7; }
        .p-img-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        .p-info { padding: 20px; text-align: center; }
        .p-title { font-weight: bold; color: var(--gold); font-size: 1.2rem; margin-bottom: 5px; }
        .price-tag { font-size: 1.1rem; color: var(--success); margin-bottom: 15px; }
        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .add-btn { background: var(--gold); border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: var(--gold); padding: 12px 20px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; z-index: 1000; }
        input[type="file"] { display: none; }
        .admin-mode [contenteditable="true"] { border: 1px dashed var(--gold); background: #2a2a2a; padding: 2px 5px; }
