<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBERCAFE & MOBILE REPAIRING HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --dark-bg: #121212; --light-bg: #fffde7; --card: #1e1e1e; }
        body { font-family: sans-serif; background-color: var(--light-bg); margin: 0; padding-bottom: 80px; }
        
        header { background: #000; color: var(--gold); padding: 20px 10px; text-align: center; border-bottom: 2px solid var(--gold); }
        
        /* NEW TOP MENU BAR (As per your sketch) */
        .nav-ribbon { 
            background: #000; 
            border-bottom: 4px solid var(--gold);
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 Columns for your 6 menu items */
            text-align: center;
        }
        .nav-ribbon a { 
            color: #fff; 
            text-decoration: none; 
            padding: 15px 5px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            text-transform: uppercase;
            border-right: 1px solid #333;
            transition: 0.3s;
        }
        .nav-ribbon a:last-child { border-right: none; }
        .nav-ribbon a:hover { background: var(--gold); color: #000; }

        .social-links a { color: var(--gold); margin: 0 10px; font-size: 1.2rem; text-decoration: none; }
        
        .container { max-width: 1100px; margin: auto; padding: 15px; }

        .disclaimer { 
            background: #c0392b; color: #fff; padding: 15px; border-radius: 8px; 
            text-align: center; margin: 20px 0; border: 2px solid var(--gold); font-size: 0.9rem;
        }

        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .add-btn { background: #000; color: var(--gold); border: 2px solid var(--gold); padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); color: #fff; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; }
        
        .img-area { height: 140px; background: #252525; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .img-area i { font-size: 3rem; color: var(--gold); opacity: 0.7; }
        .img-area img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none; }

        .info { padding: 15px; }
        .title { color: var(--gold); font-weight: bold; font-size: 1.1rem; text-align: center; text-transform: uppercase; }
        .price { color: #2ecc71; text-align: center; margin: 8px 0; font-weight: bold; }
        
        .specs-box { background: #000; padding: 10px; border-radius: 5px; font-size: 0.8rem; border-left: 3px solid var(--gold); margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #222; }
        
        .wa-btn { background: #25D366; color: #fff; text-align: center; display: block; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        
        .contact-us { background: #fff; padding: 20px; border-radius: 12px; margin-top: 30px; text-align: center; border: 2px solid var(--gold); }
        
        .admin-btn-float { position: fixed; bottom: 20px; right: 20px; background: #000; color: var(--gold); padding: 12px 20px; border-radius: 30px; border: 1px solid var(--gold); cursor: pointer; font-weight: bold; z-index: 1000; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: none; z-index: 10; }
        .admin-mode .delete-btn { display: block; }
        .admin-mode [contenteditable="true"] { background: #333; border: 1px dashed var(--gold); padding: 2px; }

        /* Responsive menu for mobile */
        @media (max-width: 600px) {
            .nav-ribbon { grid-template-columns: repeat(3, 1fr); }
            .nav-ribbon a { border-bottom: 1px solid #333; }
        }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; font-size: 1.5rem;">NGH CYBERCAFE & MOBILE REPAIRING HUB</h1>
    <div class="social-links" style="margin-top:10px;">
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-facebook"></i></a>
    </div>
</header>

<nav class="nav-ribbon">
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">Gallery</a>
    <a href="#">Contact Us</a>
    <a href="#productGrid">Product</a>
    <a href="javascript:void(0)" onclick="toggleAdmin()">Admin</a>
</nav>

<div class="container">
    <div class="disclaimer">
        <strong>⚠️ IMPORTANT DISCLAIMER:</strong><br>
        Bill Receipt & Aadhar Card are MANDATORY for Software Work & FRP Unlocking.
    </div>

    <div class="admin-controls">
        <button class="add-btn" onclick="addNewItem()">+ Add New Product</button>
    </div>

    <div class="grid" id="productGrid">
        <script>
            const items = [
                {name: "Mobile Screen Guard", icon: "fa-mobile", price: "Starting ₹ 49/-"},
                {name: "Tempered Glass", icon: "fa-shield-alt", price: "₹ 99/-"},
                {name: "Mobile Cover", icon: "fa-phone-square", price: "Starting ₹ 99/-"},
                {name: "Charger & Adapters", icon: "fa-bolt", price: "₹ 199/-"},
                {name: "Data Cables", icon: "fa-link", price: "₹ 79/-"},
                {name: "Power Bank", icon: "fa-battery-half", price: "Best Price"},
                {name: "Memory Card & Pen Drive", icon: "fa-sd-card", price: "Best Price"},
                {name: "OTG Adapter", icon: "fa-usb", price: "₹ 30/-"},
                {name: "Bluetooth Speakers", icon: "fa-volume-up", price: "₹ 499/-"}
            ];

            const grid = document.getElementById('productGrid');
            items.forEach(item => {
                grid.innerHTML += `
                <div class="card">
                    <button class="delete-btn" onclick="this.parentElement.remove()">X</button>
                    <div class="img-area" onclick="triggerImg(this)">
                        <i class="fas ${item.icon}"></i><img src=""><input type="file" style="display:none" onchange="showImg(this)">
                    </div>
                    <div class="info">
                        <div class="title" contenteditable="false">${item.name}</div>
                        <div class="price" contenteditable="false">${item.price}</div>
                        <div class="specs-box">
                            <div class="row"><span>Status:</span> <span contenteditable="false">In Stock</span></div>
                            <div class="row"><span>Quality:</span> <span contenteditable="false">Premium</span></div>
                        </div>
                        <a href="https://wa.me/917642035220" class="wa-btn">Order Now</a>
                    </div>
                </div>`;
            });
        </script>
    </div>

    <div class="contact-us">
        <h3>📍 Shop Details</h3>
        <p>Call: +91 7642035220 | Email: nghcybercafe@gmail.com</p>
        <p>Naharlagun, Arunachal Pradesh</p>
    </div>
</div>

<button class="admin-btn-float" onclick="toggleAdmin()" id="btnLock">Admin Login</button>

<script>
    let isAdmin = false;
    function toggleAdmin() {
        if (!isAdmin) {
            let pass = prompt("Password:");
            if (pass === "1234") {
                isAdmin = true;
                document.body.classList.add("admin-mode");
                document.querySelectorAll('[contenteditable]').forEach(e => e.contentEditable = "true");
                document.getElementById("btnLock").innerText = "Lock & View";
            }
        } else {
            isAdmin = false;
            document.body.classList.remove("admin-mode");
            document.querySelectorAll('[contenteditable]').forEach(e => e.contentEditable = "false");
            document.getElementById("btnLock").innerText = "Admin Login";
        }
    }

    function addNewItem() {
        const grid = document.getElementById('productGrid');
        const firstCard = grid.querySelector('.card').cloneNode(true);
        firstCard.querySelector('.title').innerText = "New Product";
        firstCard.querySelector('i').className = "fas fa-box-open";
        firstCard.querySelector('img').style.display = "none";
        grid.prepend(firstCard);
        if(isAdmin) {
            firstCard.querySelectorAll('[contenteditable]').forEach(e => e.contentEditable = "true");
        }
    }

    function triggerImg(div) { if(isAdmin) div.querySelector('input').click(); }
    function showImg(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = input.parentElement.querySelector('img');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
