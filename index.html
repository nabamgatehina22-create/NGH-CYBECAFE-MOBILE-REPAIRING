<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBERCAFE & MOBILE REPAIRING HUB | Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            /* Main Background changed to Light Yellow as requested */
            --main-bg: #fffde7; 
            
            /* Rest of the colors from the professional dark design kept same */
            --header-bg: #000; 
            --card-bg: #1e1e1e; 
            --gold: #f1c40f; 
            --text-on-dark: #ffffff; 
            --text-on-light: #000000;
            --success: #2ecc71; 
            --danger: #e74c3c;
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--main-bg); 
            color: var(--text-on-light); /* Changed to black for light background */
            margin: 0; 
            padding-bottom: 100px; 
            line-height: 1.6;
        }
        
        /* Header keeps the black background and gold text */
        header { 
            background: var(--header-bg); 
            padding: 30px; 
            text-align: center; 
            border-bottom: 4px solid var(--gold); 
        }
        
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        p { color: #888; margin: 5px 0 0; }
        
        /* Social links restored to gold color */
        .social-links { margin-top: 15px; }
        .social-links a { color: var(--gold); font-size: 1.4rem; margin: 0 12px; text-decoration: none; transition: 0.3s; }
        .social-links a:hover { color: #ffffff; transform: scale(1.2); display: inline-block; }

        .container { max-width: 1100px; margin: auto; padding: 20px; }
        
        /* Important Policy Banner restored */
        .policy-banner { 
            background: #c0392b; 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 25px; 
            text-align: center; 
            border: 1px solid var(--gold); 
            font-size: 0.85rem; 
        }

        /* Product Cards keep their dark background */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .product-card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            overflow: hidden; 
            border: 1px solid #333; 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            color: var(--text-on-dark);
        }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        
        /* Delete Button in Admin Mode */
        .delete-btn { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            background: var(--danger); 
            color: white; 
            border: none; 
            padding: 5px 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            display: none; 
            z-index: 10; 
        }
        .admin-mode .delete-btn { display: block; }

        .p-img-container { 
            width: 100%; 
            height: 160px; 
            background: #252525; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            cursor: pointer; 
        }
        .p-img-container i { font-size: 3.5rem; color: var(--gold); opacity: 0.6; }
        .p-img-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .p-info { padding: 20px; flex-grow: 1; }
        .p-title { font-weight: bold; color: var(--gold); font-size: 1.3rem; margin-bottom: 5px; text-align: center; }
        .price-tag { font-size: 1.2rem; color: var(--success); font-weight: bold; margin-bottom: 15px; text-align: center;}
        
        /* Specs Section restored and keeps dark theme */
        .specs { 
            background: #151515; 
            padding: 10px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            margin-bottom: 15px; 
            border-left: 3px solid var(--gold); 
            color: var(--text-on-dark);
        }
        .specs-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 4px 0; }
        .specs-row:last-child { border: none; }
        .spec-label { color: #888; font-weight: bold; }

        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; }
        
        /* Admin Stuff */
        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .admin-mode [contenteditable="true"] { border: 1px dashed var(--gold); background: #2a2a2a; min-width: 50px; }
        
        /* Admin Login Button keeps professional dark look */
        .admin-btn { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: #000; 
            color: var(--gold); 
            padding: 12px 20px; 
            border-radius: 30px; 
            border: 2px solid var(--gold);
            font-weight: bold; 
            cursor: pointer; 
            z-index: 1000; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>
