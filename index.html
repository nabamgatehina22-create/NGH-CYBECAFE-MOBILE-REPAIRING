<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBERCAFE | Tech Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --dark: #121212; --card: #1e1e1e; --text: #ffffff; --success: #2ecc71; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding-bottom: 100px; line-height: 1.6; }
        header { background: #000; padding: 30px; text-align: center; border-bottom: 4px solid var(--gold); }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        
        /* Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .product-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: 0.3s; display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        
        /* Image/Icon Area */
        .p-img-container { width: 100%; height: 160px; background: #252525; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-img-container i { font-size: 3.5rem; color: var(--gold); opacity: 0.6; }
        .p-img-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* Info Area */
        .p-info { padding: 20px; flex-grow: 1; }
        .p-title { font-weight: bold; color: var(--gold); font-size: 1.3rem; margin-bottom: 5px; }
        .price-tag { font-size: 1.2rem; color: var(--success); font-weight: bold; margin-bottom: 15px; }
        
        /* Specifications Table */
        .specs { background: #151515; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; border-left: 3px solid var(--gold); }
        .specs-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 4px 0; }
        .specs-row:last-child { border: none; }
        .spec-label { color: #888; font-weight: bold; }

        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; }
        
        /* Admin Stuff */
        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .admin-mode [contenteditable="true"] { border: 1px dashed var(--gold); background: #2a2a2a; min-width: 50px; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: var(--gold); padding: 12px 20px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header>
    <h1>NGH CYBERCAFE</h1>
    <p>Mobile Shop & Repair Center</p>
</header>

<div class="container">
    <div class="admin-controls">
        <button style="background:var(--gold); padding:10px 20px; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="addNewProduct()">+ Add New Stock Item</button>
    </div>

    <div class="grid" id="productGrid">
        <div class="product-card">
            <div class="p-img-container" onclick="triggerUpload(this)">
                <i class="fas fa-box-open"></i>
                <img src=""><input type="file" onchange="previewImage(this)">
            </div>
            <div class="p-info">
                <div class="p-title" contenteditable="false">Samsung 25W Charger</div>
                <div class="price-tag" contenteditable="false">₹ 999/-</div>
                
                <div class="specs">
                    <div class="specs-row"><span class="spec-label">Brand:</span> <span contenteditable="false">Samsung</span></div>
                    <div class="specs-row"><span class="spec-label">Qty:</span> <span contenteditable="false">5 Units Left</span></div>
                    <div class="specs-row"><span class="spec-label">Output:</span> <span contenteditable="false">USB-C PD 3.0</span></div>
                    <div class="specs-row"><span class="spec-label">Warranty:</span> <span contenteditable="false">6 Months</span></div>
                </div>

                <a href="https://wa.me/917642035220" class="btn-order"><i class="fab fa-whatsapp"></i> Check Availability</a>
            </div>
        </div>
        </div>
</div>

<button class="admin-btn" onclick="toggleAdmin()" id="lockBtn">Admin Login</button>

<script>
    let isAdmin = false;
    function toggleAdmin() {
        if (!isAdmin) {
            if (prompt("Password:") === "1234") {
                isAdmin = true;
                document.body.classList.add("admin-mode");
                document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = "true");
                document.getElementById("lockBtn").innerText = "Lock & Save View";
            }
        } else {
            isAdmin = false;
            document.body.classList.remove("admin-mode");
            document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = "false");
            document.getElementById("lockBtn").innerText = "Admin Login";
        }
    }

    function addNewProduct() {
        const grid = document.getElementById('productGrid');
        const newCard = grid.children[0].cloneNode(true);
        grid.appendChild(newCard);
    }

    function triggerUpload(el) { if(isAdmin) el.querySelector('input').click(); }
    function previewImage(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const container = input.parentElement;
            container.querySelector('img').src = e.target.result;
            container.querySelector('img').style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
