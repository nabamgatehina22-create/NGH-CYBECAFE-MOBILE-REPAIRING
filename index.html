<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-bg: #e3f2fd; --header-bg: #fbc02d; --card-bg: #ffffff; --text: #333; --accent: #1976d2; --danger: #e74c3c; }
        body { font-family: 'Poppins', sans-serif; background: var(--main-bg); color: var(--text); margin: 0; padding-bottom: 50px; }
        
        header { background: var(--header-bg); padding: 30px; text-align: center; border-bottom: 5px solid #f9a825; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #000; text-transform: uppercase; margin: 0; font-size: 1.6rem; font-weight: 900; }
        .social-links { margin-top: 15px; }
        .social-links a { color: #000; font-size: 1.5rem; margin: 0 12px; text-decoration: none; }

        .container { max-width: 1100px; margin: auto; padding: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .product-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.08); position: relative; transition: 0.3s; display: flex; flex-direction: column; border: 1px solid #ddd; }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: none; z-index: 10; font-weight: bold; }
        .admin-mode .delete-btn { display: block; }

        .p-img-container { width: 100%; height: 160px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-img-container i { font-size: 3.5rem; color: var(--accent); }
        .p-img-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .p-info { padding: 20px; flex-grow: 1; }
        .p-title { font-weight: bold; color: #000; font-size: 1.2rem; margin-bottom: 5px; text-align: center; }
        .price-tag { color: #2e7d32; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; text-align: center; }
        
        /* Specifications Box Wapas Aa Gaya */
        .specs { background: #f1f8ff; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; border: 1px solid #d1e9ff; }
        .specs-row { display: flex; justify-content: space-between; border-bottom: 1px solid #e1f0ff; padding: 4px 0; }
        .specs-row:last-child { border: none; }
        .spec-label { color: #666; font-weight: bold; }

        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; }

        .contact-section { background: #fff; margin-top: 50px; padding: 30px; border-radius: 15px; text-align: center; border: 2px solid var(--header-bg); }

        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .admin-mode [contenteditable="true"] { border: 2px dashed #fbc02d; background: #fffde7; padding: 2px; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: #000; color: #fff; padding: 12px 20px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; z-index: 1000; }
    </style>
</head>
