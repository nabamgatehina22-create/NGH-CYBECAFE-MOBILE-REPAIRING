<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBERCAFE & MOBILE REPAIRING HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --main-bg: #fffde7; 
            --header-bg: #000; 
            --card-bg: #1e1e1e; 
            --gold: #f1c40f; 
            --text-light: #ffffff; 
            --success: #2ecc71; 
            --danger: #e74c3c; 
        }
        body { font-family: 'Poppins', sans-serif; background: var(--main-bg); color: #000; margin: 0; padding-bottom: 100px; line-height: 1.6; }
        
        /* Header Section */
        header { background: var(--header-bg); padding: 30px; text-align: center; border-bottom: 4px solid var(--gold); }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin: 0; font-size: 1.5rem; }
        .social-links { margin-top: 15px; }
        .social-links a { color: var(--gold); font-size: 1.4rem; margin: 0 12px; text-decoration: none; }

        .container { max-width: 1200px; margin: auto; padding: 20px; }

        /* Naya Disclaimer Design */
        .policy-banner { 
            background: #c0392b; 
            color: white; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            text-align: center; 
            border: 2px solid var(--gold); 
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Product Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; transition: 0.3s; display: flex; flex-direction: column; position: relative; color: var(--text-light); }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: none; z-index: 10; }
        .admin-mode .delete-btn { display: block; }

        .p-img-container { width: 100%; height: 150px; background: #252525; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-img-container i { font-size: 3.5rem; color: var(--gold); opacity: 0.7; }
        .p-img-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .p-info { padding: 15px; flex-grow: 1; }
        .p-title { font-weight: bold; color: var(--gold); font-size: 1.1rem; text-align: center; margin-bottom: 5px; }
        .price-tag { color: var(--success); font-weight: bold; text-align: center; margin-bottom: 10px; }
        
        .specs { background: #151515; padding: 10px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; border-left: 3px solid var(--gold); }
        .specs-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 3px 0; }
        
        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; }

        /* Contact Section */
        .contact-box { background: #fff; margin-top: 50px; padding: 25px; border-radius: 15px; text-align: center; border: 2px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* Admin Setup */
        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
