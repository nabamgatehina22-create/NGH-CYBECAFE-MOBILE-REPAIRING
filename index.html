<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBERCAFE | Tech Store & Repair</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --dark: #121212; --card: #1e1e1e; --text: #ffffff; --success: #2ecc71; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding-bottom: 100px; }
        header { background: #000; padding: 40px 20px; text-align: center; border-bottom: 4px solid var(--gold); }
        h1 { font-size: 2.2rem; margin: 0; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .policy-banner { background: #c0392b; color: white; padding: 15px; border-radius: 10px; margin-bottom: 30px; text-align: center; border: 1px solid var(--gold); font-size: 0.9rem; }
        .social-links { margin-top: 20px; }
        .social-links a { color: var(--gold); font-size: 1.5rem; margin: 0 15px; text-decoration: none; transition: 0.3s; }
        .social-links a:hover { color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; transition: 0.3s; }
        .p-img-container { width: 100%; height: 200px; background: #252525; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-img-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .p-info { padding: 20px; }
        .price-tag { font-size: 1.3rem; color: var(--success); font-weight: bold; margin: 10px 0; }
        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .add-btn { background: var(--gold); border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: var(--gold); padding: 12px 20px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header>
    <h1>NGH CYBERCAFE</h1>
    <p>Mobile Repairing & Accessories Expert</p>
    <div class="social-links">
        <a href="https://youtube.com/@NGH-CYBERCAFE" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="https://facebook.com/yourpage" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://twitter.com/yourhandle" target="_blank"><i class="fab fa-x-twitter"></i></a>
    </div>
</header>

<div class="container">
    <div class="policy-banner">
        <strong>⚠️ IMPORTANT DISCLAIMER:</strong><br>
        Bill and Aadhar Card are MANDATORY for all Software/Flashing work. No work will be done without valid ID proof.
    </div>
    
    <div class="admin-controls">
        <button class="add-btn" onclick="addNewProduct()"><i class="fas fa-plus"></i> Add New Product / Stock</button>
    </div>

    <div class="grid" id="productGrid">
        <div class="product-card">
            <div class="p-img-container" onclick="triggerUpload(this)">
                <i class="fas fa-camera" style="font-size: 3rem; color: #444;"></i>
                <img src="" alt="Product">
                <input type="file" accept="image/*" onchange="previewImage(this)">
            </div>
            <div class="p-info">
                <div class="p-title" contenteditable="false" style="font-weight:bold; color:var(--gold); font-size: 1.1rem;">Product Name</div>
                <div class="price-tag" contenteditable="false">₹ 000/-</div>
                <a href="https://wa.me/917642035220" class="btn-order"><i class="fab fa-whatsapp"></i> Buy/Enquire</a>
            </div>
        </div>
    </div>
</div>

<button class="admin-btn" onclick="toggleAdmin()" id="lockBtn">Admin Login</button>

<script>
    let isAdmin = false;
    function toggleAdmin() {
        if (!isAdmin) {
            if (prompt("Enter Password:") === "1234") {
                isAdmin = true;
                document.body.classList.add("admin-mode");
                document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = "true");
                document.getElementById("lockBtn").innerText = "Lock Design";
            }
        } else {
            isAdmin = false;
            document.body.classList.remove("admin-mode");
            document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = "false");
            document.getElementById("lockBtn").innerText = "Admin Login";
        }
    }

    function addNewProduct() {
        const grid = document.getElementById('productGrid');
        const newCard = grid.firstElementChild.cloneNode(true);
        newCard.querySelector('img').style.display = 'none';
        newCard.querySelector('i').style.display = 'block';
        grid.appendChild(newCard);
    }

    function triggerUpload(el) { if(isAdmin) el.querySelector('input').click(); }
    function previewImage(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const container = input.parentElement;
            container.querySelector('img').src = e.target.result;
            container.querySelector('img').style.display = 'block';
            container.querySelector('i').style.display = 'none';
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
</body>
</html>
