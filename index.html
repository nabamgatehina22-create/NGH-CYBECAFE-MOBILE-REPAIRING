<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGH CYBER CAFE & MOBILE REPAIRING HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --dark: #121212; --card: #1e1e1e; --text: #ffffff; --success: #2ecc71; --danger: #e74c3c; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding-bottom: 100px; }
        header { background: #000; padding: 30px; text-align: center; border-bottom: 4px solid var(--gold); }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin: 0; font-size: 1.8rem; }
        .social-links { margin-top: 15px; }
        .social-links a { color: var(--gold); font-size: 1.4rem; margin: 0 12px; text-decoration: none; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .product-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; transition: 0.3s; display: flex; flex-direction: column; }
        
        /* Delete Button - Only in Admin Mode */
        .delete-btn { position: absolute; top: 10px; right: 10px; background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; display: none; z-index: 10; }
        .admin-mode .delete-btn { display: block; }

        .p-img-container { width: 100%; height: 160px; background: #252525; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .p-img-container i { font-size: 3.5rem; color: var(--gold); }
        .p-img-container img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .p-info { padding: 20px; flex-grow: 1; }
        .p-title { font-weight: bold; color: var(--gold); font-size: 1.2rem; }
        .price-tag { color: var(--success); font-weight: bold; margin: 10px 0; }
        
        .specs { background: #151515; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; }
        .specs-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 4px 0; }
        
        .btn-order { display: block; background: #25D366; color: white; text-align: center; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; }
        
        .admin-controls { display: none; text-align: center; margin-bottom: 20px; }
        .admin-mode .admin-controls { display: block; }
        .admin-mode [contenteditable="true"] { border: 1px dashed var(--gold); background: #2a2a2a; }
        .admin-btn { position: fixed; bottom: 20px; right: 20px; background: var(--gold); padding: 12px 20px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; z-index: 1000; }
    </style>
</head>
<body>

<header>
    <h1 id="shopName">NGH CYBER CAFE & MOBILE REPAIRING HUB</h1>
    <div class="social-links">
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-x-twitter"></i></a>
    </div>
</header>

<div class="container">
    <div class="admin-controls">
        <button style="background:var(--gold); padding:10px 20px; border:none; border-radius:5px; font-weight:bold;" onclick="addNewProduct()">+ Add Item</button>
    </div>

    <div class="grid" id="productGrid">
        <div class="product-card">
            <button class="delete-btn" onclick="this.parentElement.remove()">X</button>
            <div class="p-img-container" onclick="changeIcon(this)">
                <i class="fas fa-tools"></i>
                <img src=""><input type="file" style="display:none" onchange="previewImage(this)">
            </div>
            <div class="p-info">
                <div class="p-title" contenteditable="false">Repairing Service</div>
                <div class="price-tag" contenteditable="false">Contact for Price</div>
                <div class="specs">
                    <div class="specs-row"><span>Qty:</span> <span contenteditable="false">-</span></div>
                    <div class="specs-row"><span>Specs:</span> <span contenteditable="false">-</span></div>
                </div>
                <a href="https://wa.me/917642035220" class="btn-order">Order Now</a>
            </div>
        </div>
    </div>
</div>

<button class="admin-btn" onclick="toggleAdmin()" id="lockBtn">Admin Login</button>
